name: Release

# Push a tag matching the manifest version (e.g. v1.0.0) to publish a release
# with the packaged extension attached.
on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check the tag matches the manifest version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest version $version"
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Build the extension zip
        run: npm run package

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ipscout-*.zip --title "ipScout $GITHUB_REF_NAME" --generate-notes --verify-tag
