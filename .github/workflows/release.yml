name: Release

# Two ways to release; the tag must match the manifest version (e.g. v1.0.0):
#   - Publish a release from GitHub's Releases page, creating the tag there.
#   - Or push the tag from the command line.
# Either way, this builds the extension zip and attaches it to the release.
on:
  release:
    types: [published]
  push:
    tags: ['v*']

# Publishing from the Releases page can fire both events. Run them one at a
# time, so the second run just re-attaches the same zip.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check the tag matches the manifest version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest version $version"
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Build the extension zip
        run: npm run package

      - name: Attach the zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Published from the Releases page: add the zip to that release.
            gh release upload "$GITHUB_REF_NAME" dist/ipscout-*.zip --clobber
          else
            # Tag pushed from the command line: create the release.
            gh release create "$GITHUB_REF_NAME" dist/ipscout-*.zip --title "ipScout $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
