name: Bug report
description: Something in ipScout doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please **leave API keys out** of everything below, including screenshots. For security problems, use [private reporting](https://github.com/Velidoran/ipscout-extension/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Which source or screen was affected? Include the IP or input you looked up if you're comfortable sharing it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the popup
        2. Look up ...
        3. See ...

  - type: input
    id: version
    attributes:
      label: ipScout version
      description: Shown at the bottom of the settings page.
      placeholder: 1.0.0

  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 141 on Windows 11

  - type: textarea
    id: errors
    attributes:
      label: Error messages or screenshots
      description: The message shown on the source's card, or errors from the extension's console (chrome://extensions → ipScout → Inspect views).
